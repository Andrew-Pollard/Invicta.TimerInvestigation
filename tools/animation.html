<meta charset="utf-8">
<title>starting</title>
<style>
  body { margin: 0; background: #fff; font: 20px Consolas, monospace; display: flex; gap: 16px; align-items: center; padding: 10px; }
  .spinner { width: 32px; height: 32px; border: 4px solid #ccc; border-top-color: #d97757; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<div id="spinner"></div>
<div id="counter"></div>
<script>
  // ?mode=raf redraws on every animation frame, css runs only a CSS spinner, both does both, and static draws once.
  // Where requestAnimationFrame runs, the title carries the frame count so a script can measure the frame rate.
  const mode = new URLSearchParams(location.search).get('mode') || 'both';
  const counter = document.getElementById('counter');
  if (mode === 'css' || mode === 'both') {
    document.getElementById('spinner').className = 'spinner';
  }

  document.title = mode + ' 0';
  counter.textContent = mode;
  if (mode === 'raf' || mode === 'both') {
    let frames = 0;
    const tick = () => {
      frames++;
      counter.textContent = mode + ' ' + frames;
      if (frames % 30 === 0) {
        document.title = mode + ' ' + frames;
      }

      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
</script>
